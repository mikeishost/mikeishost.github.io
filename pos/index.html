<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>St. Thomas POS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header with Bluetooth Status -->
    <header class="header">
        <div class="header-left">
            <h1>St. Thomas POS</h1>
        </div>
        <div class="header-right">
            <div class="bluetooth-status" id="bluetoothStatus">
                <span class="status-indicator disconnected"></span>
                <span id="statusText">Disconnected</span>
            </div>
            <button class="btn btn-connect" id="connectBtn">Connect</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Word Cloud Selectors -->
        <section class="word-cloud-section">
            <div class="word-cloud">
                <div class="word-line" id="line1">
                    <!-- Generated dynamically -->
                </div>
            </div>
            <div class="word-cloud">
                <div class="word-line" id="line2">
                    <!-- Generated dynamically -->
                </div>
            </div>
        </section>

        <!-- Manual Entry Section -->
        <section class="manual-entry">
            <div class="keypad">
                <input type="text" id="customAmount" class="amount-input" placeholder="0.00" readonly>
                <div class="keypad-grid">
                    <button class="key" data-key="1">1</button>
                    <button class="key" data-key="2">2</button>
                    <button class="key" data-key="3">3</button>
                    <button class="key" data-key="4">4</button>
                    <button class="key" data-key="5">5</button>
                    <button class="key" data-key="6">6</button>
                    <button class="key" data-key="7">7</button>
                    <button class="key" data-key="8">8</button>
                    <button class="key" data-key="9">9</button>
                    <button class="key" data-key="0">0</button>
                    <button class="key" data-key=".">.</button>
                    <button class="key backspace" data-key="backspace">⌫</button>
                </div>
                <button class="btn btn-add-custom" id="addCustomBtn">Add</button>
            </div>
        </section>

        <!-- Cart Section -->
        <section class="cart-section">
            <h2>Cart</h2>
            <div class="cart-list" id="cartList">
                <!-- Generated dynamically -->
            </div>
        </section>
    </main>

    <!-- Action Bar (Fixed Bottom) -->
    <footer class="action-bar">
        <div class="total-display">
            <span class="total-label">Total:</span>
            <span class="total-amount" id="totalAmount">$0.00</span>
        </div>
        <button class="btn btn-clear" id="clearBtn">Clear</button>
        <button class="btn btn-checkout" id="checkoutBtn">Checkout</button>
    </footer>

    <!-- Edit Item Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2>Edit Item</h2>
            <form id="editForm">
                <div class="form-group">
                    <label for="editName">Item Name:</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label for="editPrice">Price:</label>
                    <input type="number" id="editPrice" step="0.01" min="0" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Save</button>
                    <button type="button" class="btn btn-cancel" id="cancelEditBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Checkout / Tender Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content checkout-modal-content">
            <h2>Checkout</h2>
            <div class="checkout-total">
                <span class="checkout-label">Final Total:</span>
                <span class="checkout-amount" id="checkoutAmount">$0.00</span>
            </div>
            <div class="payment-buttons">
                <button class="btn btn-payment" data-payment="Cash">Cash</button>
                <button class="btn btn-payment" data-payment="NETS">NETS</button>
                <button class="btn btn-payment" data-payment="PayNow">PayNow</button>
                <button class="btn btn-payment" data-payment="Visa/Mastercard">Visa/Mastercard</button>
            </div>
            <button class="btn btn-cancel" id="cancelCheckoutBtn">Cancel</button>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Processing...</p>
    </div>

    <script src="storage.js"></script>
    <script src="bluetooth.js"></script>
    <script src="receipt.js"></script>
    <script src="app.js"></script>
</body>
</html>
